<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>상담시뮬레이션톡</title>
<meta name="description" content="예비 교사가 가상의 학생·학부모와 상담하며 내 답의 법적 리스크를 조문·판례와 함께 바로 첨삭받는 훈련 프로그램">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃 개념: 교무실 책상 — 왼쪽은 상담 톡(메신저), 오른쪽은 상담일지(빨간펜 첨삭). 데스크톱은 좌측 고정 내비, 모바일은 하단 탭. */
:root {
  --paper: #F2F5F3;
  --surface: #FFFFFF;
  --surface-2: #E8EEEA;
  --ink: #16221D;
  --ink-2: #51625A;
  --line: #D3DCD7;
  --board: #1E4A3D;
  --board-2: #173A30;
  --board-ink: #F1F6F3;
  --chalk: #F2C94C;
  --chalk-ink: #3A2E05;
  --pen: #C4342B;
  --pen-bg: #FBEAE8;
  --warn: #9A6410;
  --warn-bg: #FBF1DC;
  --safe: #1C7448;
  --safe-bg: #E3F3EA;
  --shadow: 0 1px 2px rgba(22, 34, 29, .06), 0 8px 24px rgba(22, 34, 29, .06);
  --font-display: "Gothic A1", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-pen: "Nanum Pen Script", "Gaegu", "Noto Sans KR", cursive;
  --r-s: 6px;
  --r-m: 12px;
  --r-l: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1714; --surface: #17221E; --surface-2: #1F2D28; --ink: #E4ECE8; --ink-2: #9CB0A6; --line: #2B3B35;
    --board: #2B6A57; --board-2: #1B4136; --board-ink: #F1F6F3; --chalk: #F2C94C; --chalk-ink: #3A2E05;
    --pen: #F0786E; --pen-bg: #3A1D1A; --warn: #E3AE55; --warn-bg: #3A2D14; --safe: #62C595; --safe-bg: #173426;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1714; --surface: #17221E; --surface-2: #1F2D28; --ink: #E4ECE8; --ink-2: #9CB0A6; --line: #2B3B35;
  --board: #2B6A57; --board-2: #1B4136; --board-ink: #F1F6F3; --chalk: #F2C94C; --chalk-ink: #3A2E05;
  --pen: #F0786E; --pen-bg: #3A1D1A; --warn: #E3AE55; --warn-bg: #3A2D14; --safe: #62C595; --safe-bg: #173426;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }   /* 단독 실행 파일에서도 hidden 이 display 지정에 밀리지 않게 */
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.3; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--board); }
:root[data-theme="dark"] a { color: var(--safe); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) a { color: var(--safe); } }
:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 앱 뼈대 ---------- */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100%; }
.nav {
  background: var(--board); color: var(--board-ink); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px;
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; height: 100dvh;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
.brand span { font-size: 12px; opacity: .78; }
.brand i { font-family: var(--font-pen); font-style: normal; color: var(--chalk); font-size: 20px; line-height: 1; }
.nav-list { display: flex; flex-direction: column; gap: 4px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--board-ink);
  padding: 10px 12px; border-radius: var(--r-s); font-weight: 500; opacity: .82;
}
.nav-btn:hover { background: rgba(255, 255, 255, .08); opacity: 1; }
.nav-btn[aria-current="page"] { background: var(--chalk); color: var(--chalk-ink); opacity: 1; font-weight: 700; }
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-foot { margin-top: auto; font-size: 11.5px; line-height: 1.55; opacity: .7; padding: 0 8px; }
.main {
  min-width: 0; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav {
    position: fixed; inset: auto 0 0 0; height: auto; z-index: 30; flex-direction: row; padding: 6px 8px;
    padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
    box-shadow: 0 -4px 16px rgba(0, 0, 0, .18);
  }
  .brand, .nav-foot { display: none; }
  .app.in-sim .nav { display: none; }            /* 상담 중에는 하단 탭을 숨겨 답변 영역을 넓힌다 */
  .app.in-sim .main { padding-block: 12px 24px; }
  .app.in-sim .chat { height: min(44vh, 420px); min-height: 220px; }
  .nav-list { flex-direction: row; flex: 1; gap: 2px; }
  .nav-btn { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 11px; text-align: center; justify-content: center; min-height: 48px; }
  .main { padding-block: 16px 96px; }
}

/* ---------- 공통 부품 ---------- */
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--ink-2); }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-size: 26px; font-weight: 800; }
.page-head p { color: var(--ink-2); max-width: 62ch; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: var(--r-s);
  padding: 10px 16px; font-weight: 700; background: var(--board); color: var(--board-ink); min-height: 44px; text-decoration: none;
}
.btn:hover { background: var(--board-2); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.chalk { background: var(--chalk); color: var(--chalk-ink); }
.btn.chalk:hover { filter: brightness(.95); background: var(--chalk); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 500; min-height: 38px;
}
.chip:hover { border-color: var(--board); }
.chip[aria-pressed="true"] { background: var(--board); border-color: var(--board); color: var(--board-ink); font-weight: 700; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.safe { background: var(--safe-bg); color: var(--safe); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.risk { background: var(--pen-bg); color: var(--pen); }
.tag.spec { background: var(--chalk); color: var(--chalk-ink); }
.lawchip {
  display: inline-flex; align-items: center; gap: 5px; border: 1px dashed var(--ink-2); background: transparent; color: var(--ink); border-radius: 4px;
  padding: 3px 9px; font-size: 12.5px; font-weight: 500; text-align: left;
}
.lawchip:hover { border-style: solid; border-color: var(--board); background: var(--surface-2); }
.lawchip::before { content: "§"; font-weight: 800; color: var(--ink-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 18px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.notice { font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; }

/* ---------- 홈 ---------- */
.hero { background: var(--board); color: var(--board-ink); border-radius: var(--r-l); padding: 28px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.hero .eyebrow { color: var(--chalk); }
.hero h1 { font-size: clamp(28px, 4.4vw, 40px); font-weight: 800; letter-spacing: -.03em; margin: 6px 0 10px; }
.hero p { opacity: .9; max-width: 46ch; }
.hero .row { margin-top: 18px; }
.hero .btn.ghost { color: var(--board-ink); border-color: rgba(255, 255, 255, .35); }
.hero .btn.ghost:hover { background: rgba(255, 255, 255, .1); }
.demo { background: var(--paper); color: var(--ink); border-radius: var(--r-m); padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.demo .bubble { max-width: 92%; }
.demo .memo { align-self: flex-end; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); padding: 22px 18px; } }

.picker { display: grid; gap: 14px; }
.picker-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: start; }
.picker-row > span { font-weight: 700; font-size: 13px; color: var(--ink-2); padding-top: 9px; }
@media (max-width: 560px) { .picker-row { grid-template-columns: minmax(0, 1fr); gap: 6px; } .picker-row > span { padding-top: 0; } }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12.5px; color: var(--ink-2); }
.stat b.text { font-size: 16px; padding: 5px 0; }
@media (max-width: 560px) { .stats { grid-template-columns: minmax(0, 1fr); } }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 19px; font-weight: 800; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.sc-card {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px; display: flex; flex-direction: column; gap: 10px;
  transition: transform .12s ease, border-color .12s ease; min-width: 0;
}
.sc-card:hover { border-color: var(--board); transform: translateY(-2px); }
.sc-card h3 { font-size: 16.5px; font-weight: 700; }
.sc-card .hook { color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sc-card .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.who { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; }
.who i { width: 8px; height: 8px; border-radius: 50%; background: var(--board); display: inline-block; }
.who.parent i { background: var(--warn); }
.diff { letter-spacing: 2px; color: var(--pen); font-size: 11px; }
.best { font-weight: 700; color: var(--safe); }
.empty { border: 1px dashed var(--line); border-radius: var(--r-m); padding: 28px; text-align: center; color: var(--ink-2); }

/* ---------- 상담 준비(브리핑) ---------- */
.brief { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .brief { grid-template-columns: minmax(0, 1fr); } }
.brief h1 { font-size: 24px; font-weight: 800; }
.kv { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; }
.kv dt { color: var(--ink-2); font-weight: 700; font-size: 13px; }
.kv dd { margin: 0; }
.goal-list { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.opt-group { display: grid; gap: 8px; }
.opt-group > b { font-size: 13px; color: var(--ink-2); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 9px 14px; font-size: 13.5px; font-weight: 500; min-height: 40px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--board); color: var(--board-ink); font-weight: 700; }
.seg button[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- 시뮬레이션 ---------- */
.sim { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
@media (max-width: 980px) { .sim { grid-template-columns: minmax(0, 1fr); } .side { order: -1; } }
.phone { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.phone-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: var(--board); flex: none; }
.avatar.parent { background: var(--warn-bg); color: var(--warn); }
.avatar.speaking { animation: ring 1.2s ease-in-out infinite; }
@keyframes ring { 0%, 100% { box-shadow: 0 0 0 2px var(--chalk); } 50% { box-shadow: 0 0 0 6px var(--chalk); } }
@media (prefers-reduced-motion: reduce) { .avatar.speaking { animation: none; box-shadow: 0 0 0 3px var(--chalk); } }
.phone-head .btn.small { white-space: nowrap; }
.btn.mic.live { border-color: var(--pen); color: var(--pen); background: var(--pen-bg); }
.btn.mic.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pen); flex: none; }
.phone-head b { display: block; font-size: 15px; line-height: 1.3; }
.phone-head span { font-size: 12px; color: var(--ink-2); }
.chat { height: min(54vh, 520px); min-height: 280px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); scroll-behavior: smooth; }
.bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; }
.bubble.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; }
.bubble.me { align-self: flex-end; background: var(--board); color: var(--board-ink); border-top-right-radius: 4px; }
.bubble.me.struck { text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 2px; }
.sys { align-self: center; font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 3px 12px; text-align: center; }
.typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; border-top-left-radius: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); animation: blink 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; } .sc-card { transition: none; } .chat { scroll-behavior: auto; } }

/* 빨간펜 첨삭 메모 */
.memo { align-self: flex-end; max-width: 92%; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; display: grid; gap: 8px; font-size: 13.5px; }
.memo.risk { border-color: var(--pen); background: var(--pen-bg); }
.memo.warn { border-color: var(--warn); background: var(--warn-bg); }
.memo.safe { border-color: var(--safe); background: var(--safe-bg); }
.stamp { font-family: var(--font-pen); font-size: 24px; line-height: 1; display: inline-flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.memo.risk .stamp { color: var(--pen); } .memo.warn .stamp { color: var(--warn); } .memo.safe .stamp { color: var(--safe); }
.stamp small { font-family: var(--font-body); font-size: 12.5px; font-weight: 700; }
.better { border-left: 3px solid var(--safe); padding: 2px 0 2px 10px; }
.better b { display: block; font-size: 12px; color: var(--safe); }

.reply { border-top: 1px solid var(--line); padding: 12px 16px 16px; display: grid; gap: 10px; background: var(--surface); }
.timer { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.timer-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.timer-bar i { display: block; height: 100%; width: 100%; background: var(--board); transform-origin: left; }
.timer.hurry .timer-bar i { background: var(--pen); }
.timer.hurry b { color: var(--pen); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-m); padding: 11px 14px; font-size: 14.5px; line-height: 1.55; min-height: 48px; }
.opt:hover { border-color: var(--board); background: var(--surface-2); }
.free { display: grid; gap: 8px; }
.free textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; background: var(--surface); line-height: 1.6; }
.free .row { justify-content: space-between; }
.hint { font-size: 12.5px; color: var(--ink-2); }

.side { display: grid; gap: 12px; }
.side .card { padding: 14px 16px; display: grid; gap: 10px; }
.side h3 { font-size: 13px; font-weight: 800; color: var(--ink-2); letter-spacing: .04em; }
.gauge { display: grid; gap: 4px; font-size: 12.5px; }
.gauge .row { justify-content: space-between; }
.gauge-bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.gauge-bar i { display: block; height: 100%; background: var(--board); transition: width .4s ease; }
.gauge.risk .gauge-bar i { background: var(--pen); }
details.fold > summary { cursor: pointer; font-weight: 700; font-size: 13.5px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.fold > summary::after { content: "펼치기"; font-size: 12px; color: var(--ink-2); font-weight: 500; }
details.fold[open] > summary::after { content: "접기"; }
details.fold > summary::-webkit-details-marker { display: none; }

/* ---------- 리포트 ---------- */
.report-top { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 640px) { .report-top { grid-template-columns: minmax(0, 1fr); justify-items: start; } }
.ring { position: relative; width: 168px; height: 168px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .num b { font-family: var(--font-display); font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .num span { display: block; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.verdict { font-family: var(--font-pen); font-size: 34px; line-height: 1.1; }
.axes { display: grid; gap: 10px; }
.axis { display: grid; grid-template-columns: 96px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }

    'ese20-2': { type: '법령', name: '초·중등교육법 제20조의2·제20조의6', title: '생활지도 권한과 아동학대 적용 배제', src: S, url: ESE,
      gist: '교원은 법령과 학칙에 따라 학생을 지도할 수 있다(제20조의2①). 정당한 생활지도, 방어·보호를 위한 제지, 개별학생교육지원, 스마트기기 사용 제한은 아동복지법 제17조 제3·5·6호의 금지행위로 보지 않는다(제20조의6). 아동학대처벌법 제2조 제3호도 교원의 정당한 교육활동과 생활지도는 아동학대로 보지 않는다고 정한다.',
      talk: '보호받는 것은 법령과 학칙에 근거한 ‘정당한’ 지도다. 그래서 “학칙에 따라, 두 번 주의한 뒤”처럼 근거와 절차를 말로 드러내고 기록한다.' },
    'ese20-4': { type: '법령', name: '초·중등교육법 제20조의4', title: '개별학생교육지원(분리 지도)', date: '2026.3.1. 시행', src: S, url: ESE,
      gist: '학생이 수업 진행이 불가능할 정도로 교육활동을 방해해 다른 학생의 학습권 보호가 필요하면 일시적으로 분리해 개별 교육지원을 할 수 있다. 필요한 최소한도여야 하고, 시행령 제40조의4가 적용 기준(2회 이상 주의에도 반복되는 방해 등)과 학교장 보고·보호자 통지를 정한다.',
      talk: '“뒤에 세워 놨다”가 아니라 “몇 번 주의한 뒤, 어디에서, 몇 분”을 말할 수 있어야 한다. 분리한 사실은 기록하고 절차대로 알린다.' },
    'restrain': { type: '법령', name: '초·중등교육법 제20조의2 제3항', title: '방어 및 보호를 위한 제지', date: '2026.3.1. 시행', src: S, url: ESE,
      gist: '학생의 행위가 자신이나 타인의 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우에는 필요한 최소한도로 제지할 수 있다. 제지한 교원은 학교장에게 지체 없이 보고하고 학교장은 보호자에게 알린다.',
      talk: '휴대전화를 손에서 낚아채는 식의 물리력은 ‘긴급한 경우’가 아니다. 제지했다면 “위험해서 제지했고 바로 보고하고 연락드렸다”고 설명할 수 있어야 한다.' },
    'ese-d40-3': { type: '법령', name: '초·중등교육법 시행령 제40조의3', title: '신체에 고통을 주는 지도 금지', src: S, url: LAW + '초ㆍ중등교육법시행령',
      gist: '학생생활지도는 조언, 상담, 주의, 훈육·훈계 등의 방법으로 하되, 도구나 신체 등을 이용해 학생의 신체에 고통을 가하는 방법을 써서는 안 된다. 방어·보호를 위한 제지에도 같은 제한이 적용된다.',
      talk: '엎드려뻗쳐, 감정이 실린 벌세우기는 실행하면 처벌 대상이고 “맞아야 정신 차리지”처럼 말로만 해도 위협이 된다.' },
    'phone-law': { type: '법령', name: '초·중등교육법 제20조의5', title: '수업 중 스마트기기 사용 제한', date: '2026.3.1. 시행', src: S, url: ESE,
      gist: '학생은 수업 중에 휴대전화 등 스마트기기를 사용해서는 안 된다. 보조기기로 쓰는 경우, 교육 목적, 긴급 상황 대응으로 학교장과 교원이 허용한 경우는 예외다. 교내 사용·소지 제한의 기준과 방법은 학칙으로 정한다.',
      talk: '“법이니까 무조건 압수”가 아니라 “수업 중 사용은 법으로 제한되고, 보관 방식은 우리 학교 학칙에 따릅니다”라고 말한다.' },
    'ese18-5': { type: '법령', name: '초·중등교육법 제18조의5', title: '학생의 정서·행동 지원(상담·치료 권고)', date: '2026학년도 시행', src: S, url: ESE,
      gist: '학교장은 학교 구성원과 정신건강 등 전문가의 의견을 들어 학생과 보호자에게 상담을 받도록 권고할 수 있고, 상담 결과를 반영해 치료 권고나 상담·학습 지원을 할 수 있다. 보호자는 협조해야 하며, 지속적인 권고에도 정당한 사유 없이 따르지 않으면 대통령령이 정한 절차에 따라 필요한 지원을 할 수 있다.',
      talk: '교사는 진단하는 사람이 아니다. 병명 대신 관찰한 행동과 횟수를 말하고, 권고는 혼자가 아니라 학교 절차로 진행한다.' },
    'ese18-6': { type: '법령', name: '초·중등교육법 제18조의6', title: '보호자의 의무', src: S, url: ESE,
      gist: '보호자는 교직원이나 다른 학생의 인권을 침해해서는 안 되고, 교원의 학생생활지도를 존중하고 지원해야 하며, 교원과 학교의 전문적인 판단을 존중하고 교육활동에 적극 협력해야 한다.',
      talk: '조문을 들이밀며 훈계하라는 뜻이 아니다. 무리한 요구를 거절할 때 “그 요구는 제가 할 수 있는 범위 밖입니다”라고 말할 수 있는 근거다.' },
    'complaint-law': { type: '법령', name: '초·중등교육법 제35~37조', title: '학교민원 대응의 법제화', date: '2026.10.29. 시행', src: S, url: ESE,
      gist: '학교에 민원대응팀을, 교육청에 학교민원대응지원팀을 둔다. 민원을 제기하는 사람은 교육활동을 침해해서는 안 되고, 침해 우려가 있으면 학교장이 중지를 요청한 뒤 통화·면담 종료, 퇴거, 일시적 출입 제한, 수사기관 신고를 할 수 있다(시행령 제65조).',
      talk: '“제 번호로 카톡 주세요” 대신 “민원은 학교 대표번호로 접수해 주시면 민원대응팀이 답변드립니다.” 조치의 주체는 학교장이므로 교사는 혼자 버티지 말고 바로 보고한다.' },
    'tsa19': { type: '법령', name: '교원지위법 제19조', title: '교육활동 침해행위', src: S, url: TSA,
      gist: '교육활동 중인 교원에 대한 폭행·협박·명예훼손·무고 등 범죄행위와, 목적이 정당하지 않은 민원을 반복 제기하는 행위, 교원의 법적 의무가 아닌 일을 지속적으로 강요하는 행위가 침해행위다. 고시는 교원의 영상·음성을 촬영·녹음·합성해 무단 배포하는 행위도 포함한다. 2026.12.3.부터는 1회라도 교육활동에 현저한 지장을 주는 민원과 비대면 교육활동까지 넓어진다.',
      talk: '침해인지 아닌지는 지역교권보호위원회가 판단한다. 통화 중에 “교권 침해로 신고하겠다”고 맞서지 말고, 기록해서 학교에 신고한다.' },
    'tsa-measure': { type: '법령', name: '교원지위법 제20조·제26조·제35조', title: '침해 뒤의 보호 조치와 보호자 조치', src: S, url: TSA,
      gist: '침해를 알게 된 학교장은 가해자와 피해 교원을 즉시 분리한다. 교권보호위원회는 보호자에게 서면사과와 재발방지 서약, 특별교육·심리치료를 조치할 수 있고, 불참하면 300만원 이하 과태료다. 중대한 사안은 관할청이 고발할 수 있다.',
      talk: '대응 수단은 제도 안에 있다. 개인적인 맞고소 경고 대신 학교와 교육청 교육활동보호센터(1395)에 지원을 요청한다.' },
    'ca-opinion': { type: '법령', name: '교원지위법 제17조·아동학대처벌법 제17조의3', title: '교육감 의견 제출 제도', src: S, url: TSA,
      gist: '교원의 생활지도가 아동학대로 신고되어 조사나 수사가 시작되면 교육감이 7일 이내(1회 연장 가능)에 정당한 생활지도였는지 의견을 낸다. 수사기관은 이를 기록에 붙이고 참고해야 한다. 아동학대로 신고됐다는 이유만으로는 정당한 사유 없이 직위해제할 수 없다(교원지위법 제6조③).',
      talk: '신고 얘기가 나와도 통화에서 방어전을 펼 필요가 없다. 사실을 기록해 학교에 보고하는 것이 가장 강한 대응이다.' },
    'cw17': { type: '법령', name: '아동복지법 제17조·제71조', title: '아동학대 금지행위와 처벌', src: S, url: LAW + '아동복지법',
      gist: '성적 학대(제2호), 신체적 학대(제3호), 아동의 정신건강과 발달에 해를 끼치는 정서적 학대(제5호)를 금지한다. 제3·5호 위반은 5년 이하 징역 또는 5천만원 이하 벌금이고, 유죄가 되면 학교 등 아동 관련 기관 취업제한(10년 이내)이 함께 선고될 수 있다(제29조의3).',
      talk: '벌금형으로 끝나는 말 한마디도 교직을 잃는 문제가 될 수 있다. 능력과 인격을 깎아내리는 표현, 공개적 망신, 위협을 피하고 행동만 짚는다.' },
    'ca10': { type: '법령', name: '아동학대처벌법 제10조 제2항·제63조', title: '아동학대 신고의무', src: S, url: CA,
      gist: '학교의 장과 그 종사자는 직무를 수행하면서 아동학대범죄를 알게 된 경우나 그 의심이 있는 경우 시·도, 시·군·구 또는 수사기관에 즉시 신고해야 한다. 정당한 사유 없이 신고하지 않으면 1천만원 이하 과태료다.',
      talk: '“확실해지면”, “본인이 원하면”은 지연이다. 학생이 비밀을 부탁해도 약속할 수 없고, 의심 대상이 동료 교사여도 의무는 같다.' },
    'ca-protect': { type: '법령', name: '아동학대처벌법 제10조 제3항·제62조', title: '신고자 보호', src: S, url: CA,
      gist: '누구든지 신고인의 인적사항이나 신고인임을 미루어 알 수 있는 사실을 누설하거나 공개·보도해서는 안 된다. 위반하면 3년 이하 징역 또는 3천만원 이하 벌금이다.',
      talk: '아이에게 “누가 알렸는지는 지켜진다”고 말할 수 있다. 보호자가 신고자를 물으면 “신고자 정보는 법으로 말씀드릴 수 없습니다”로 답한다.' },
    'sv20': { type: '법령', name: '학교폭력예방법 제20조', title: '학교폭력 신고의무', src: S, url: SV,
      gist: '학교폭력 현장을 보거나 그 사실을 알게 된 사람은 학교 등 관계기관에 즉시 신고해야 한다. 교원이 학교폭력의 예비·음모를 알게 되면 학교장에게 보고하고 해당 학부모에게 알려야 한다.',
      talk: '“선생님만 알고 있을게”, “이번만 조용히 넘어가자”는 할 수 없는 말이다. “제가 알게 된 이상 학교에 알리고 절차대로 진행해야 합니다.”' },
    'sv21': { type: '법령', name: '학교폭력예방법 제21조·제22조', title: '비밀누설 금지', src: S, url: SV,
      gist: '학교폭력 업무를 수행하거나 수행했던 사람은 가해·피해 학생과 신고자 관련 자료를 누설할 수 없다. 위반하면 1년 이하 징역 또는 1천만원 이하 벌금이다. 비밀의 범위에는 성명·주소 등 개인정보와 심의 과정의 발언이 포함된다(시행령 제33조).',
      talk: '상대 학생의 연락처, 주소, 과거 조치, 신고자가 누구인지는 “말씀드릴 수 없습니다”가 정답이다. “모릅니다”라는 거짓말도, 말끝 흐리기도 답이 아니다.' },
    'sv13-2': { type: '법령', name: '학교폭력예방법 제13조의2', title: '학교장 자체해결의 요건', src: S, url: SV,
      gist: '2주 이상 진단서가 없고, 재산 피해가 없거나 즉시 복구됐고, 지속적이지 않고, 보복행위가 아닌 경우에 한해, 피해 학생과 보호자가 심의위원회 개최를 원하지 않으면 학교장이 자체해결할 수 있다. 서면 확인과 전담기구 심의를 거친다.',
      talk: '담임이 “제 선에서 정리해 드릴게요”라고 할 수 있는 제도가 아니다. 요건과 절차를 안내할 뿐이다.' },
    'sv16': { type: '법령', name: '학교폭력예방법 제16조·제17조 제4항', title: '피해학생 보호와 분리', src: S + ' · 2026 학교폭력 사안처리 가이드북', url: SV,
      gist: '피해 학생에게 심리상담, 일시보호, 치료 등 보호조치를 할 수 있다. 학교는 사안을 인지하면 관련 학생의 분리 여부를 24시간 안에 정해 최대 7일까지 분리할 수 있고, 학교장은 접촉·협박·보복 금지 조치를 지체 없이 해야 한다.',
      talk: '전학이나 학급 교체는 약속할 수 없어도 “지금 할 수 있는 분리와 보호 조치”는 구체적으로 말할 수 있다.' },
    'sv17': { type: '법령', name: '학교폭력예방법 제17조', title: '가해학생 조치(1~9호)', src: S, url: SV,
      gist: '서면사과(1호), 접촉·협박·보복 금지(2호), 학교봉사, 사회봉사, 특별교육, 출석정지, 학급교체(7호), 전학(8호), 퇴학(9호)의 조치는 교육지원청 학교폭력대책심의위원회가 심의해 정한다.',
      talk: '교사는 “전학 보내겠다”도 “별일 없을 거다”도 약속할 수 없다. 조치 수위에 대한 개인 의견도 말하지 않는다.' },
    'sv-record': { type: '법령', name: '초·중등교육법 시행규칙 제21조·제22조', title: '학교폭력 조치의 생기부 기재와 보존', src: S + ' · 2026 학교폭력 사안처리 가이드북', url: LAW + '초ㆍ중등교육법시행규칙',
      gist: '조치 결정이 통보되면 학교생활기록부에 기재한다. 1~3호는 이행하면 기재가 유보되고, 4·5호는 졸업 후 2년, 6~8호는 4년간 보존되며 9호는 삭제 대상이 아니다. 불복 절차 중에도 삭제하지 않는다. 대입 전형에도 반영된다.',
      talk: '“안 남게 해 보겠다”는 말은 할 수 없다. “기재와 삭제 시기는 법령으로 정해져 있어 학교가 바꿀 수 없습니다.”' },
    'sv-cover': { type: '법령', name: '학교폭력예방법 제11조 제11항·제11조의4', title: '축소·은폐의 징계와 정당한 처리의 면책', src: S, url: SV,
      gist: '교육감은 학교폭력을 축소·은폐한 교원에 대해 징계의결을 요구해야 하고, 이 경우 징계는 감경되지 않는다. 반대로 법령과 학칙을 지킨 정당한 사안 처리와 생활지도는 민사상·형사상 책임을 지지 않는다.',
      talk: '“애들끼리 그럴 수 있죠”, “좋게 좋게 끝내자”가 축소·은폐의 시작이다. 절차대로 처리한 교사는 법이 보호한다.' },
    'pipa18': { type: '법령', name: '개인정보 보호법 제17조·제18조·제71조', title: '개인정보의 제3자 제공과 목적 외 이용 금지', src: S, url: PIPA,
      gist: '정보주체의 동의 없이 개인정보를 제3자에게 제공하거나 수집 목적 밖으로 이용하면 5년 이하 징역 또는 5천만원 이하 벌금이다. 학교가 받은 동의는 그 목적 범위에서만 유효하다.',
      talk: '다른 학생과 학부모의 연락처, 가정사, 성적, 징계는 어떤 학부모에게도 말하지 않는다. 학교 홈페이지용 동의로 교사 개인 SNS에 사진을 올릴 수 없다.' },
    'pipa23': { type: '법령', name: '개인정보 보호법 제23조', title: '민감정보(건강 등)', src: S, url: PIPA,
      gist: '건강, 사상·신념 등 사생활을 현저히 침해할 우려가 있는 민감정보는 별도 동의나 법령 근거 없이 처리할 수 없다. 학생의 진단명, 복용 약, 상담·치료 이력이 여기에 해당할 수 있다.',
      talk: '다른 학생에게 “걔는 자폐가 있어서”라고 설명하지 않는다. 건강 정보는 지도에 꼭 필요한 교직원만 알고 다룬다.' },
    'pipa22-2': { type: '법령', name: '개인정보 보호법 제22조의2', title: '아동의 개인정보(사진·영상 게시)', src: S + ' · 교육부 개인정보보호 업무사례집', url: PIPA,
      gist: '만 14세 미만 아동의 개인정보를 처리하려면 법정대리인의 동의가 필요하다. 교육부 사례집은 학생 사진과 영상을 홈페이지나 SNS에 올리거나 학부모에게 보낼 때 학생(14세 미만은 법정대리인)의 동의를 받도록 안내한다.',
      talk: '얼굴과 이름표가 나온 수업 사진은 개인정보다. “예뻐서 자랑하려고”는 근거가 되지 않는다.' },
    'crim307': { type: '법령', name: '형법 제307조·제311조', title: '명예훼손과 모욕', src: S, url: LAW + '형법',
      gist: '공연히 사실을 적시해 명예를 훼손하면 2년 이하 징역 또는 500만원 이하 벌금, 허위 사실이면 5년 이하 징역 등으로 처벌한다. 모욕은 1년 이하 징역 또는 200만원 이하 벌금이다. 한 사람에게 말해도 전파될 가능성이 있으면 공연성이 인정된다(대법원 2020도5813 전원합의체).',
      talk: '학부모 한 명에게 한 “그 집 어머니가 원래 유별나세요”도 문제 될 수 있다. 평가 대신 날짜, 행동, 조치만 말한다.' },
    'cpa3': { type: '법령', name: '통신비밀보호법 제3조·제14조', title: '대화 녹음의 적법과 위법', src: S, url: LAW + '통신비밀보호법',
      gist: '공개되지 않은 타인 간의 대화를 녹음하는 것은 금지되고 1년 이상 10년 이하 징역에 해당한다. 그러나 대화에 참여한 당사자가 녹음하는 것은 위법이 아니다(대법원 2006도4981, 2008도1237). 학부모가 교사와의 통화나 면담을 녹음하는 것도, 교사가 민원 통화를 녹음하는 것도 적법하다.',
      talk: '“녹음은 불법이니 끄세요”는 틀린 말이다. 모든 상담은 녹음되고 있다고 생각하고 말한다. “녹음하셔도 됩니다. 저도 기록을 위해 녹음하겠습니다.”' },
    'graft8': { type: '법령', name: '청탁금지법 제8조·제9조', title: '교사의 선물 수수 금지', src: S + ' · 국민권익위원회 해석', url: LAW + '부정청탁및금품등수수의금지에관한법률',
      gist: '직무와 관련해서는 금액과 관계없이 금품을 받을 수 없다. 국민권익위원회는 학생을 평가·지도하는 담임과 교과 교사에게는 5만원 이하 선물, 면담 때의 커피와 간식도 허용되지 않는다고 해석한다. 받았다면 지체 없이 신고하고 돌려준다. 학생 대표가 공개적으로 주는 카네이션과 손편지는 가능하다.',
      talk: '“커피 정도는 괜찮아요”가 아니라 “마음만 받겠습니다. 저는 ○○이를 평가하는 사람이라 받을 수 없게 되어 있어요.”' },
    'record': { type: '법령', name: '학교생활기록 작성 및 관리지침 제4조·제19조', title: '생기부 기재와 정정', date: '교육부훈령 제555호, 2026.3.1. 시행', src: S, url: 'https://www.law.go.kr/행정규칙/학교생활기록작성및관리지침',
      gist: '학교생활기록부는 교사가 직접 관찰하고 평가한 내용을 근거로 기록한다. 학년도 마감 후 정정은 원칙적으로 금지되고, 객관적 증빙자료가 있을 때만 학업성적관리위원회 심의를 거쳐 정정한다. 허위로 입력하면 공전자기록 위작으로 처벌될 수 있다(대법원 2019도11294 전원합의체).',
      talk: '“원하시는 대로 고쳐 볼게요”는 범죄의 약속이다. “오류라면 증빙자료와 함께 정정 절차를 안내드리겠습니다.”' },
    'neutral6': { type: '법령', name: '교육기본법 제6조·제14조', title: '교육의 정치적 중립', src: S, url: LAW + '교육기본법',
      gist: '교육은 정치적·파당적 또는 개인적 편견을 전파하는 방편으로 이용되어서는 안 된다. 교원은 특정 정당이나 정파를 지지하거나 반대하기 위해 학생을 지도하거나 선동해서는 안 된다.',
      talk: '쟁점은 여러 관점을 함께 다루고 “제 정치적 견해는 말씀드리지 않습니다”라고 말한다. 민원이 오면 발언 사실을 부인하지 말고 맥락과 보완 계획을 설명한다.' },
    'safety': { type: '법령', name: '학교안전법 제35조·제41조', title: '학교안전공제 보상 절차', src: S, url: SAFE,
      gist: '교육활동 중 사고의 치료비 등은 학교안전공제회에 청구할 수 있다. 공제회는 청구를 받은 날부터 14일 이내에 지급 여부를 결정하고, 결정에 불복하면 심사를 청구할 수 있다.',
      talk: '“치료비는 제가 내겠습니다”가 아니라 “학교안전공제회 청구 대상이고 서류는 학교가 도와드립니다.”' },
    'safety-immune': { type: '법령', name: '학교안전법 제10조 제5항', title: '안전조치 의무를 다한 교직원의 면책', date: '2025.12.2. 개정', src: S, url: SAFE,
      gist: '학교장, 교직원, 보조인력은 안전사고관리 지침에 따라 학생에 대하여 안전조치의무를 다한 경우에는 학교안전사고에 대하여 민사상·형사상 책임을 지지 아니한다.',
      talk: '면책의 전제는 지침에 따른 조치와 그 기록이다. “법이 바뀌어서 교사는 책임 없습니다”라고 말하지 말고, 조치한 내용을 시간순으로 설명한다.' },
    'yp34': { type: '법령', name: '청소년성보호법 제34조·제67조', title: '성범죄 신고의무', src: S + ' · 2026 학교폭력 사안처리 가이드북', url: LAW + '아동ㆍ청소년의성보호에관한법률',
      gist: '학교 종사자는 직무상 아동·청소년 대상 성범죄 발생 사실을 알게 되면 즉시 수사기관에 신고해야 하고, 신고하지 않으면 300만원 이하 과태료다. 가이드북은 성 관련 사안을 피해 측 의사와 관계없이 112나 117에 신고하도록 한다.',
      talk: '“부모님께도 경찰에도 말 안 할게”는 할 수 없는 약속이다. 세부를 캐묻지 말고 “선생님은 법에 따라 신고해야 해. 네 뜻은 그대로 전할게.”' },
    'sex14-2': { type: '법령', name: '성폭력처벌법 제14조의2', title: '딥페이크(허위영상물)', date: '2024.10.16. 개정', src: S, url: LAW + '성폭력범죄의처벌등에관한특례법',
      gist: '사람의 얼굴이나 신체를 성적 수치심을 일으키는 형태로 합성하거나 퍼뜨리면 7년 이하 징역 또는 5천만원 이하 벌금이다. 소지·구입·저장·시청도 3년 이하 징역 또는 3천만원 이하 벌금이다. 피해자가 아동·청소년이면 청소년성보호법이 더 무겁게 처벌한다. 삭제 지원은 중앙디지털성범죄피해자지원센터(1366)가 맡는다.',
      talk: '“증거로 그 사진 선생님한테 보내 줘”는 금물이다. 교사라고 예외가 없다. “지우지 말고 그대로 둬. 경찰에 같이 알리자.”' },
    'special': { type: '법령', name: '장애인차별금지법 제13조', title: '장애학생 차별 금지', src: S, url: LAW + '장애인차별금지및권리구제등에관한법률',
      gist: '교육책임자는 장애를 이유로 입학을 거부하거나 전학을 강요할 수 없고, 수업과 교내외 활동 참여를 제한하거나 배제해서는 안 된다. 교직원은 장애 학생과 그 관련자를 모욕하거나 비하해서는 안 된다.',
      talk: '“특수학교가 더 맞을 것 같다”, “다른 모둠으로 빼 줄게”, “○○이 같은 아이”가 모두 차별 발언이 될 수 있다. 장애가 아니라 필요한 지원을 말한다.' },
    'copyright': { type: '법령', name: '저작권법 제2조·제10조', title: '학생 작품의 저작권', src: S, url: LAW + '저작권법',
      gist: '저작자는 저작물을 창작한 사람이고 저작권은 창작한 때부터 생긴다. 수업 시간에 만든 그림, 글, 영상의 저작자는 그것을 만든 학생이다.',
      talk: '“수업에서 만든 거라 학교 것”이 아니다. 작품을 외부에 게시하거나 출품할 때는 학생과 보호자의 동의를 받는다.' },

    /* ───────── 고시·지침 ───────── */
    'notice-counsel': { type: '고시·지침', name: '교원의 학생생활지도에 관한 고시 제10조', title: '상담의 원칙, 거부와 중단', date: '교육부고시 제2026-3호', src: S, url: NOTICE,
      gist: '상담은 수업시간 외가 원칙이고 일시와 방법은 사전에 협의한다. 교원은 사전에 목적·일시·방법이 합의되지 않은 상담, 직무 범위를 넘어선 상담, 근무시간 외의 상담을 거부할 수 있다. 폭언·협박·폭행이 있으면 상담을 즉시 중단할 수 있고, 상담 내용을 제3자에게 누설해서는 안 된다.',
      talk: '“퇴근 후에도 언제든 전화 주세요”는 하지 않는다. “상담 일시와 주제를 미리 정하겠습니다”, “폭언이 계속되면 상담을 중단하겠습니다.”' },
    'notice-phone': { type: '고시·지침', name: '교원의 학생생활지도에 관한 고시 제11조·제12조', title: '주의와 훈육(물품 분리보관)', date: '교육부고시 제2026-3호', src: S, url: NOTICE,
      gist: '수업 중 스마트기기 사용에 주의를 주고 제한할 수 있다. 2회 이상 주의에도 계속 사용하는 물품이나 학칙이 정한 스마트기기는 분리해 보관할 수 있고, 학교장에게 보고한 뒤 보호자에게 알린다. 소지품 조사는 합리적 의심이 있을 때에 한한다.',
      talk: '순서는 주의, 제출 요구, 분리보관, 기록이다. 보관한 기기의 화면이나 내용을 들여다보지 않는다.' },
    'notice-discipline': { type: '고시·지침', name: '교원의 학생생활지도에 관한 고시 제13조·제17조', title: '훈계와 이의제기', date: '교육부고시 제2026-3호', src: S, url: NOTICE,
      gist: '훈계할 때는 사유와 개선 방안을 함께 제시한다. 과제는 대안 행동, 성찰하는 글쓰기, 훼손된 것의 원상복구로 줄 수 있다. 학생과 보호자는 생활지도에 대해 14일 이내에 학교장에게 이의를 제기할 수 있고 학교장은 14일 이내에 답한다.',
      talk: '“반성문 써 와”, “사과할 때까지 급식 없다”가 아니라 “무엇이 문제였고 다음에 어떻게 할지 써 보자.” 항의에는 “이의는 학교장께 제기하실 수 있습니다”로 경로를 안내한다.' },
    'sv-inv': { type: '고시·지침', name: '2026년 학교폭력 사안처리 가이드북(교육부)', title: '사안 처리 중 교사가 하지 말아야 할 말', date: '2026.2.', src: '교육부', url: GUIDE,
      gist: '심의 결정 전에는 가해·피해를 단정하지 말고 ‘관련 학생’으로 부른다. 성급한 화해 종용, 강제로 한자리에 모아 화해시키기, 비난과 심문은 금지된다. 보호자에게는 확인된 사실만 알리고 조치 수위나 개인 의견을 말하지 않으며, 동의 없이 상대의 주소와 전화번호를 주지 않는다. 조사는 전담조사관이나 전담기구가 맡는다.',
      talk: '“가해자”, “서로 사과하고 끝내자” 대신 “관련 학생 모두의 이야기를 따로 듣겠습니다.”' },
    'ca-guide': { type: '고시·지침', name: '아동학대 의심 아동과의 대화 원칙', title: '듣고, 기록하고, 신고한다', src: '아동권리보장원 신고 안내', url: 'https://www.ncrc.or.kr/ncrc/cm/cntnts/cntntsView.do?mi=1030&cntntsId=1484',
      gist: '신고는 112로 하고 신고자의 신분은 법으로 보호된다. 학대가 의심되는 아이와 이야기할 때는 답을 정해 놓은 질문과 같은 질문의 반복을 피하고, 아이의 말을 그대로 기록하며, 가정 내 학대가 의심되면 신고 사실을 보호자에게 먼저 알리지 않는 것이 신고의무자 교육에서 공통으로 강조되는 원칙이다. 이 프로그램은 면담 원칙의 교육부 가이드 원문 문구까지는 직접 확인하지 못했다.',
      talk: '“아빠가 때렸지?”가 아니라 “어떤 일이 있었는지 말해 줄 수 있니?” 조사는 교사의 일이 아니다.' },
    'suicide': { type: '고시·지침', name: '학생 자해대응 교사용 안내서(교육부·학생정신건강지원센터)', title: '자해·자살 위기와 비밀보장의 한계', date: '2019.9.', src: '교육부·학생정신건강지원센터', url: 'https://ichk.icesc.kr/boardCnts/fileDown.do?fileSeq=83ed2ba36636d22e2f12e2abc5bd1769',
      gist: '절대적인 비밀 유지를 약속하지 말고, 안전과 관련된 일은 필요한 사람에게 알린다는 점을 미리 설명하고 설득한다. 관리자에게 보고하고 보호자에게 알리며, 외부 기관 의뢰는 보호자 동의를 받는다. “무조건 알려야 해” 식의 통보도 나쁜 예로 든다. 자살예방 상담전화는 109(24시간)다.',
      talk: '“아무한테도 말 안 할게”도, “규정이라 알려야 해”도 아니다. “네 안전과 관련된 일은 부모님과 학교가 함께 돕게 되어 있어. 어떻게 말씀드릴지 같이 정하자.”' },
    'grade-appeal': { type: '고시·지침', name: '학업성적관리 시행지침(시도교육청)·학교 학업성적관리규정', title: '평가 기준 공개와 이의신청', date: '경기도교육청 2026학년도 지침 기준', src: '경기도교육청', url: 'https://www.goe.go.kr/resource/goe/na/bbs_2675/2026/02/410e7664-15c3-434c-82a0-b6a4ee78eec1.pdf',
      gist: '수행평가 채점 기준은 시행 전에 학생과 학부모에게 안내하고 공지한 대로 시행한다. 이의신청 절차는 학교 학업성적관리규정으로 정해 처리하고, 부정행위 여부는 학업성적관리위원회가 심의한다. 성적은 본인만 확인하게 하며 게시는 금지된다.',
      talk: '점수는 요청이나 압박이 아니라 답안과 기준으로만 바뀐다. 다른 학생의 점수와 답안을 보여 주며 설명하지 않는다.' },
    'ai-assess': { type: '고시·지침', name: '수행평가 시 AI 활용 관리 방안(교육부)', title: 'AI 활용 수행평가의 기준', date: '2025.12.23.', src: '교육부 보도자료', url: 'https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=104984&lev=0&m=020402',
      gist: 'AI 사용을 일률적으로 금지하지 않고, 과제별 활용 범위 설정, 활용 과정 표기 지도, 학생 유의사항 사전 안내, 수업 중 과정 중심의 평가 설계, 개인정보 보호의 다섯 영역을 제시한다. 대필 의심 사안의 처리는 학교의 부정행위 심의 절차를 따른다.',
      talk: '“AI로 쓴 게 뻔해서 0점”은 근거 없는 단정이다. “사전에 안내한 기준과 수행 과정 기록으로 규정 절차에 따라 판단합니다.”' },
    'trainee': { type: '고시·지침', name: '사범대학 학교현장실습 안내서', title: '교육실습생이 지켜야 할 선', date: '인하대 2024.12., 전남대 2026', src: '인하대 사범대학 학교현장실습 매뉴얼', url: 'https://edcollege.inha.ac.kr/bbs/edcollege/944/174018/download.do',
      gist: '학생 지도는 교내에서 하고 SNS 등 교육 목적 이외의 사적인 접촉은 금한다. 실습 중 학생에게 일어나는 모든 일은 지도교사와 논의하고 학부모와 직접 접촉하지 않는다. 학생의 성적과 신상의 비밀을 외부에 말하지 않는다. 교육실습생은 초·중등교육법이 정한 교원이 아니어서 독자적인 생활지도 권한이나 면책 규정의 주체로 보기 어렵다.',
      talk: '“제가 책임지고 해결할게요”, “비밀로 해 줄게” 대신 “저는 실습생이라 지도 선생님께 바로 알리고 함께 도울게.”' },
    'm-complaint': { type: '고시·지침', name: '학교 민원 응대 안내자료(교육부)', title: '민원 응대 권장 화법', date: '2024.3.', src: '교육부(경기도교육청 게시본)', url: 'https://www.goe.go.kr/resource/old/BBSMSTR_000000000107/BBS_202410080511161001.pdf',
      gist: '끝까지 경청하고 공감한 뒤 사실과 법적 근거로 답한다. 감정적 맞대응, 조언과 충고, 언쟁은 피한다. 즉답이 어려우면 “지금 바로 답변드리기 어려울 것 같습니다. 내용을 확인하여 전달하겠습니다”라고 한다. 폭언에는 “폭언을 계속하시면 정상적인 상담이 어렵습니다”라고 알리고 녹음하며, 계속되면 종료를 알린다.',
      talk: '모르는 것을 아는 척하지 않는다. “잘 모르겠습니다. 좀 더 알아보고 알려 드려도 될까요?”가 공식 권장 표현이다.' },
    'm-policy': { type: '고시·지침', name: '학교민원 대응 및 교육활동 보호 강화 방안(교육부)', title: '개인 연락처 민원 금지와 창구 일원화', date: '2026.1.22.', src: '대한민국 정책브리핑', url: 'https://www.korea.kr/news/policyNewsView.do?newsId=148958423',
      gist: '민원 창구를 학교 대표번호와 온라인 시스템(이어드림)으로 일원화하고, 교사 개인 연락처나 SNS를 통한 민원 접수를 금지했다. 중대한 침해는 교권보호위원회 심의 후 교육감이 고발하도록 권고하고 민원상담실과 교육활동보호센터를 늘린다.',
      talk: '개인 번호로 연락이 오면 받아 주다가 지치지 말고 첫 연락에서 “민원과 상담은 학교 대표번호로 부탁드립니다”라고 안내한다.' },

    /* ───────── 판례·결정 ───────── */
    'c-redcard': { type: '판례·결정', name: '헌법재판소 2023.10.26. 2022헌마1119', title: '레드카드 사건(기소유예 취소)', src: '헌법재판소 결정', url: 'https://www.law.go.kr/LSW/detcInfoP.do?detcSeq=186425',
      gist: '수업 중 소란을 반복한 학생의 이름표를 칠판 레드카드 옆에 붙인 초등교사에게 검찰이 정서적 학대 혐의를 인정해 기소유예했으나, 헌재는 전원일치로 취소했다. 정서적 학대는 교육 목적의 정상적인 훈육과 구별되어야 하고, 증거가 부족한데 혐의를 인정한 것은 잘못이라고 봤다.',
      talk: '미리 약속된 규칙, 짧은 시간, 모든 학생에게 같은 적용이 훈육의 근거가 된다. 지도 규칙은 학기 초에 공지해 둔다.' },
    'c-teacherchange': { type: '판례·결정', name: '대법원 2023.9.14. 2023두37858', title: '반복적 담임 교체 요구는 교육활동 침해', src: '대법원 판결', url: 'https://www.scourt.go.kr/sjudge/1695278362601_153922.pdf',
      gist: '레드카드 지도 뒤 학부모가 계속 담임 교체만 요구한 사건에서, 대법원은 교사의 전문적 판단은 특별한 사정이 없는 한 존중되어야 하고 담임 교체 요구는 다른 해결이 불가능한 비상한 상황에서 보충적으로만 허용된다고 판단했다.',
      talk: '무리한 요구에는 교육 방법을 조정하는 대안을 먼저 제시하고 그 과정을 기록해 둔다.' },
    'c-getup': { type: '판례·결정', name: '대법원 2024.10.8. 2021도13926', title: '팔을 잡아 일으킨 지도', src: '대법원 판결', url: 'https://scourt.go.kr/sjudge/1728886749348_151909.pdf',
      gist: '수업과 급식 이동을 거부하는 초등학생에게 “야, 일어나”라며 팔을 잡아 일으키려 한 교사가 신체적 학대로 기소됐으나, 대법원은 법령과 학칙의 취지에 따른 객관적으로 타당한 지도는 다소의 유형력이 따랐다는 이유만으로 학대가 아니라며 파기환송했다.',
      talk: '그래도 신체 접촉은 마지막 수단이다. 접촉이 있었다면 왜 필요했는지 바로 기록하고 보호자에게 알린다.' },
    'c-rec2020': { type: '판례·결정', name: '대법원 2024.1.11. 2020도1538', title: '가방 속 녹음기', src: '대법원 판결', url: 'https://www.scourt.go.kr/sjudge/1705406803035_210643.pdf',
      gist: '학부모가 자녀 가방에 녹음기를 넣어 수업 중 교사의 발언을 녹음한 파일에 대해, 대법원은 공개되지 않은 타인 간의 대화를 제3자가 녹음한 것이어서 증거로 쓸 수 없다고 판단했다. 교사는 2025년 무죄가 확정됐다. 다만 가방 녹음기로 드러난 발언에 대한 정직 3개월 징계는 형사 무죄와 별개로 법원(서울고법, 2025.4. 보도)이 정당하다고 봤다.',
      talk: '무죄의 이유는 증거 문제였지 발언이 괜찮았다는 뜻이 아니다. “불법 녹음”을 방패로 삼지 말고 내 말부터 돌아본다.' },
    'c-juho': { type: '판례·결정', name: '수원지법 2025.5.13. 항소심(대법원 심리 중)', title: '특수교사 몰래 녹음 사건', date: '2026.10. 보도 기준 미확정', src: '파이낸셜뉴스 보도', url: 'https://www.fnnews.com/news/202610061626188867',
      gist: '특수교사가 자폐성 장애 학생에게 한 “버릇이 매우 고약하다”, “싫어 죽겠어” 등의 발언이 부모의 몰래 녹음으로 드러났다. 1심은 벌금 200만원 선고유예, 항소심은 녹음의 증거능력을 부정해 무죄를 선고했다. 검찰이 상고해 2026년 10월 보도 기준 대법원에 계류 중이며 확정되지 않았다.',
      talk: '결론과 별개로, 지친 순간의 혼잣말도 누군가 듣고 있다고 생각하고 말해야 한다.' },
    'c-emotional': { type: '판례·결정', name: '대법원 2020.3.12. 2017도5769 등', title: '정서적 학대의 판단 기준', src: '대법원 판결', url: 'https://www.law.go.kr/LSW/precInfoP.do?precSeq=226181',
      gist: '정서적 학대인지는 행위자와 아동의 관계, 행위 당시의 태도, 아동의 연령·성향·건강 상태, 아동의 반응과 이후 변화, 행위의 반복성과 기간을 종합해 판단한다. 2026년 대법원(2024도6945)은 신체에 손상을 주거나 유기·방임하는 것과 같은 정도의 행위여야 한다고 판시했다.',
      talk: '판결을 가르는 것은 반복, 공개성, 능력과 인격에 대한 비하다. 수업 방해 직후의 한 차례 훈계와 한 달간 이어진 비하는 다르게 판단된다.' },
    'c-busan': { type: '판례·결정', name: '대법원 2026.9.10. 선고(초등 담임 벌금 500만원 확정)', title: '말만으로 유죄가 확정된 사례', src: '파이낸셜뉴스 보도', url: 'https://www.fnnews.com/news/202610111053343006',
      gist: '초등학교 4학년 담임이 한 달 동안 다른 학생들 앞에서 “공부를 그렇게 못하면 어짜노, 너 때문에 스트레스 받는다”, “베낀 거 아니고?” 등을 반복해 벌금 500만원이 확정됐다. 부모의 몰래 녹음은 증거에서 빠졌지만 아이의 진술과 일기장으로 유죄가 인정됐다.',

    'c-liar': { type: '판례·결정', name: '대법원 2026.6.25. 2024도6945', title: '“사기꾼” 발언과 알림장 게시', src: '대법원 판결', url: 'https://www.scourt.go.kr/sjudge/1782712159230_144919.pdf',

    bad: '급하시면 제 개인 카톡으로 연락 주세요. 밤에도 봅니다.', good: '상담은 근무시간에 학교 대표번호로 부탁드립니다. 긴급한 일도 대표번호로 주시면 바로 전달됩니다.',
    why: '2026년부터 교사 개인 연락처와 SNS로는 민원을 받지 않는 것이 원칙입니다. 근무시간 외 상담은 거부할 수 있습니다.' },
  { id: 'PH40', who: 'parent', tag: 'guarantee', laws: ['ese20-2', 'ese20-4'], ctx: '“우리 애는 앞으로 건드리지 마세요”라는 학부모에게',
    bad: '네, 앞으로 댁의 아이는 따로 지도하지 않겠습니다.', good: '아이가 덜 속상할 방법은 고민하겠습니다. 다만 규정에 따른 지도를 하지 않겠다는 약속은 드리기 어렵습니다.',
    why: '지도를 포기하는 약속은 지킬 수 없고, 다른 학생들을 보호할 책임을 내려놓는 말이 됩니다.' },
  { id: 'PH41', who: 'parent', tag: 'dodge', laws: ['m-complaint'], ctx: '담당이 아닌 일을 묻는 학부모에게',
    bad: '그건 제 소관이 아닙니다.', good: '그 부분은 담당 선생님이 답변드릴 내용입니다. 오늘 전달하고 내일까지 연락드리게 하겠습니다.',
    why: '사실이어도 상대를 돌려보내는 말입니다. 누가 언제까지 답하는지를 함께 알려야 합니다.' },
  { id: 'PH42', who: 'parent', tag: 'dodge', laws: ['m-complaint'], ctx: '확인하지 못한 내용을 묻는 학부모에게',
    bad: '모르겠는데요.', good: '잘 모르겠습니다. 좀 더 알아보고 알려 드려도 될까요?',
    why: '교육부 민원 응대 안내자료가 직접 제시하는 바꿔 말하기입니다. 모르는 것은 확인하고 시한을 약속합니다.' },
  { id: 'PH43', who: 'parent', tag: 'legaljudge', laws: ['ai-assess', 'n-ai'], ctx: 'AI 대필이 의심되는 과제의 감점에 항의하는 학부모에게',
    bad: 'AI로 쓴 게 뻔해서 0점 처리했습니다.', good: '미리 공지한 확인 면담에서 본인 글을 설명하지 못한 점을 기준에 따라 반영했습니다.',
    why: '심증이나 탐지 도구만으로 부정행위를 단정할 수 없습니다. 사전에 공지한 기준과 과정 확인이 근거입니다.' },
  { id: 'PH44', who: 'parent', tag: 'privacy', laws: ['pipa22-2', 'pipa18'], ctx: '개인 SNS에 올린 수업 사진에 항의하는 학부모에게',
    bad: '학교 동의서 받았으니 제 인스타에 올려도 문제없습니다.', good: '그 동의는 학교가 정한 용도에만 해당합니다. 바로 내리고 확인하실 수 있게 보내 드리겠습니다.',
    why: '동의는 받은 목적 안에서만 유효합니다. 교사 개인 계정 게시는 목적 밖 이용입니다.' },
  { id: 'PH45', who: 'parent', tag: 'discriminate', laws: ['special'], ctx: '통합학급 지도에 항의하는 장애 학생의 학부모에게',
    bad: '아이는 특수학교가 더 맞을 것 같습니다.', good: '아이가 힘들어하는 시간대와 지도 방법을 개별화교육 회의에서 함께 점검하겠습니다.',
    why: '이 맥락의 전학 권유는 전학 강요로 받아들여지고 장애를 이유로 한 차별이 될 수 있습니다.' },
  { id: 'PH46', who: 'parent', tag: 'cold', laws: ['m-complaint'], ctx: '무리한 요청을 하는 학부모에게',
    bad: '규정상 안 됩니다.', good: '그 방법은 규정상 어렵습니다. 대신 이런 절차는 가능합니다.',
    why: '틀린 말은 아니지만 벽처럼 들립니다. 거절에는 이유와 대안이 함께 있어야 민원으로 번지지 않습니다.' },
  { id: 'PH47', who: 'parent', tag: 'threat', laws: ['grade-appeal'], ctx: '감점에 계속 항의하는 학부모에게',
    bad: '계속 이러시면 부정행위로 정식 처리할 수도 있습니다.', good: '부정행위 여부는 제가 아니라 학업성적관리위원회가 심의합니다. 지금까지 그런 절차는 진행되지 않았습니다.',
    why: '절차를 위협의 수단으로 쓰면 보복으로 받아들여집니다. 권한이 누구에게 있는지를 사실대로 말합니다.' },
  { id: 'PH48', who: 'parent', tag: 'secret', laws: ['suicide', 'pipa23'], ctx: '자녀의 자해 사실이 소문날까 걱정하는 학부모에게',
    bad: '저만 알고 있겠습니다. 학교에는 말하지 않을게요.', good: '지도에 꼭 필요한 선생님들만 알고 다루겠습니다. 학급이나 다른 학부모에게는 알려지지 않게 하겠습니다.',
    why: '위기 사안은 관리자와 상담교사가 함께 다뤄야 합니다. 혼자 알고 있겠다는 약속은 지킬 수 없고 대응도 늦어집니다.' }
];

</script>
<script>
(function () {
  'use strict';

  var D = window.SIMTALK_DATA || {};
  var TAGS = D.TAGS || {}, TOPICS = D.TOPICS || {}, MAJORS = D.MAJORS || [], LAWS = D.LAWS || {};
  var SCENARIOS = D.SCENARIOS || [], PHRASES = D.PHRASES || [], META = D.META || {};
  var STANDALONE = !!window.SIMTALK_STANDALONE;

  var AXES = { legal: '법적 안전', empathy: '공감·경청', process: '절차 준수', boundary: '경계·중립' };
  var GRADE = { safe: { label: '안전', pts: 10 }, warn: { label: '주의', pts: 5 }, risk: { label: '위험', pts: 0 } };
  var LAW_TYPES = ['법령', '고시·지침', '판례·결정', '사건·뉴스', '통계·매뉴얼'];

  /* ---------- 도구 ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* 무시 */ }

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('simtalk:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('simtalk:' + k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } }
  };

  var profile = store.get('profile', { who: 'all', level: 'all', major: 'all' });
  var settings = store.get('settings', { mode: 'choice', timer: 30, fb: 'instant', voice: 'off' });
  if (!settings.voice) { settings.voice = 'off'; }
  var history = store.get('history', []);
  var quizBest = store.get('quizBest', null);

  var view = $('#view'), layer = $('#layer'), nav = $('#nav');
  var sample = null;      // AI(Claude) 호출 함수. 없으면 null
  var sim = null;         // 진행 중인 상담
  var quiz = null;        // 진행 중인 퀴즈
  var ui = { lawType: 'all', lawQ: '', phWho: 'all', phTag: 'all', resetAsk: false };
  var toastId = 0;
  var flowSeq = 0;      // 비동기 흐름 식별자(상담이 바뀌면 이전 흐름 무효)

  /* ---------- 내비 ---------- */
  var NAV = [
    { k: 'home', label: '훈련 고르기', d: 'M4 5h16v11H9l-5 4z' },
    { k: 'quiz', label: '말실수 퀴즈', d: 'M13 2 4 14h7l-1 8 9-12h-7z' },
    { k: 'phrases', label: '말실수 사전', d: 'M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2zM9 8h6M9 12h6' },
    { k: 'laws', label: '법률 근거', d: 'M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8' },
    { k: 'record', label: '내 기록', d: 'M4 20V10M10 20V4M16 20v-7M22 20H2' }
  ];
  function renderNav(cur) {
    var active = (cur === 'sim' || cur === 'report') ? 'home' : cur;
    nav.innerHTML =
      '<div class="brand"><i>빨간펜 첨삭</i><b>상담시뮬레이션톡</b><span>예비 교사 법률 대처 훈련</span></div>' +
      '<div class="nav-list">' + NAV.map(function (n) {
        return '<button class="nav-btn" data-go="' + n.k + '"' + (n.k === active ? ' aria-current="page"' : '') + '>' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + n.d + '"/></svg>' +
          '<span>' + n.label + '</span></button>';
      }).join('') + '</div>' +
      '<div class="nav-foot">교육·훈련용 자료입니다. 실제 사안은 학교 관리자, 교육청 교육활동보호센터, 변호사와 상의하세요.' +
      (META.asOf ? '<br>법령 기준일 ' + esc(META.asOf) : '') + '</div>';
  }

  /* ---------- 라우팅 ---------- */
  var ROUTES = { home: renderHome, quiz: renderQuiz, phrases: renderPhrases, laws: renderLaws, record: renderRecord, sim: renderSim, report: renderReport };
  function current() { var h = (location.hash || '#home').slice(1); return ROUTES[h] ? h : 'home'; }
  function go(name) { if (current() === name) { render(); } else { location.hash = name; } }
  function render() {
    var r = current();
    if (r !== 'sim') { stopTimer(); voiceStop(); }
    if (r !== 'quiz') { stopQuizTimer(); }
    if ((r === 'sim' || r === 'report') && !sim) { r = 'home'; }
    renderNav(r);
    var shell = $('.app');
    if (shell) { shell.classList.toggle('in-sim', r === 'sim' && !!sim && sim.stage !== 'brief'); }
    ROUTES[r]();
    if (r !== 'sim') { window.scrollTo(0, 0); }
  }
  window.addEventListener('hashchange', render);

  function refocus(attr, group, val) {
    var els = document.querySelectorAll('[' + attr + '="' + group + '"]');
    for (var i = 0; i < els.length; i++) { if (els[i].dataset.val === val) { try { els[i].focus({ preventScroll: true }); } catch (e) { /* 무시 */ } return; } }
  }
  function toast(msg) {
    var id = ++toastId;
    var old = $('.toast'); if (old) { old.remove(); }
    var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { if (id === toastId && t.parentNode) { t.remove(); } }, 3200);
  }

  /* ---------- 공통 조각 ---------- */
  function lawChip(id) {
    var l = LAWS[id]; if (!l) { return ''; }
    return '<button class="lawchip" data-law="' + esc(id) + '">' + esc(l.name) + '</button>';
  }
  function lawChips(ids) { return (ids || []).map(lawChip).join(' '); }
  function tagLabel(t) { return TAGS[t] ? TAGS[t].label : t; }
  function whoLabel(w) { return w === 'parent' ? '학부모' : '학생'; }
  function bestOf(id) {
    var b = null; history.forEach(function (h) { if (h.id === id && (b == null || h.score > b)) { b = h.score; } });
    return b;
  }
  function isSpec(s) { return profile.major !== 'all' && s.majors.indexOf(profile.major) >= 0; }
  function matchScenarios() {
    return SCENARIOS.filter(function (s) {
      return (profile.who === 'all' || s.who === profile.who) &&
        (profile.level === 'all' || s.levels.indexOf(profile.level) >= 0) &&
        (profile.major === 'all' || s.majors.indexOf('공통') >= 0 || s.majors.indexOf(profile.major) >= 0);
    }).sort(function (a, b) { return (isSpec(b) ? 1 : 0) - (isSpec(a) ? 1 : 0) || a.diff - b.diff; });
  }
  function majorsFor(level) {
    return MAJORS.filter(function (m) { return level === 'all' || m.levels.indexOf(level) >= 0; });
  }
  function scCard(s) {
    var b = bestOf(s.id);
    return '<button class="sc-card" data-sc="' + esc(s.id) + '">' +
      '<div class="row" style="justify-content:space-between">' +
      '<span class="who ' + s.who + '"><i></i>' + whoLabel(s.who) + ' 상담</span>' +
      '<span class="row" style="gap:6px">' + (isSpec(s) ? '<span class="tag spec">내 전공</span>' : '') +
      '<span class="tag">' + esc(s.levels.join('·')) + '</span></span></div>' +
      '<h3>' + esc(s.title) + '</h3>' +
      '<p class="hook">“' + esc(s.sub) + '”</p>' +
      '<div class="foot"><span class="row" style="gap:6px"><span class="tag">' + esc(TOPICS[s.topic] || s.topic) + '</span>' +
      '<span class="diff" title="난이도 ' + s.diff + '/3" aria-label="난이도 ' + s.diff + '/3">' + '●'.repeat(s.diff) + '<span style="opacity:.25">' + '●'.repeat(3 - s.diff) + '</span></span></span>' +
      (b == null ? '<span>' + esc(s.channel) + ' · ' + s.turns.length + '턴</span>' : '<span class="best">최고 ' + b + '점</span>') +
      '</div></button>';
  }

  /* ---------- 홈 ---------- */
  function topMistake() {
    var c = {}; history.forEach(function (h) { (h.tags || []).forEach(function (t) { c[t] = (c[t] || 0) + 1; }); });
    var best = null; Object.keys(c).forEach(function (k) { if (!best || c[k] > c[best]) { best = k; } });
    return best;
  }
  function renderHome() {
    if (profile.major !== 'all' && !majorsFor(profile.level).some(function (m) { return m.k === profile.major; })) { profile.major = 'all'; }
    var list = matchScenarios();
    var avg = history.length ? Math.round(history.reduce(function (a, h) { return a + h.score; }, 0) / history.length) : null;
    var tm = topMistake();
    var counts = { law: 0, cas: 0, news: 0 };
    Object.keys(LAWS).forEach(function (k) {
      var t = LAWS[k].type;
      if (t === '판례·결정') { counts.cas++; } else if (t === '사건·뉴스') { counts.news++; } else { counts.law++; }
    });
    function chip(group, val, label) {
      return '<button class="chip" data-pick="' + group + '" data-val="' + esc(val) + '" aria-pressed="' + (profile[group] === val) + '">' + esc(label) + '</button>';
    }
    view.innerHTML =
      '<section class="hero">' +
      '<div><div class="eyebrow">예비 교사를 위한 법률 대처 훈련</div>' +
      '<h1>상담시뮬레이션톡</h1>' +
      '<p>학생과 학부모의 한마디에 제한 시간 안에 답해 보세요. 그 답이 법적으로 안전했는지, 어떤 조문과 판례에 걸리는지 바로 첨삭해 드립니다.</p>' +
      '<div class="row"><button class="btn chalk" data-act="quick">내 조건으로 바로 시작</button>' +
      '<button class="btn ghost" data-go="quiz">10문항 말실수 퀴즈</button></div></div>' +
      '<div class="demo" aria-hidden="true">' +
      '<div class="bubble them">선생님… 이거 비밀 지켜 주실 거죠?</div>' +
      '<div class="bubble me struck">그럼, 선생님만 알고 있을게.</div>' +
      '<div class="memo risk"><span class="stamp">위험! <small>비밀보장 절대 약속</small></span>' +
      '<span>학대·학교폭력을 알게 된 교사는 신고 의무가 있어 이 약속을 지킬 수 없습니다.</span></div>' +
      '</div></section>' +

      '<section class="card picker" aria-label="훈련 조건">' +
      '<div class="picker-row"><span>상대</span><div class="chips">' + chip('who', 'all', '전체') + chip('who', 'student', '학생') + chip('who', 'parent', '학부모') + '</div></div>' +
      '<div class="picker-row"><span>학교급</span><div class="chips">' + chip('level', 'all', '전체') + chip('level', '초', '초등학교') + chip('level', '중', '중학교') + chip('level', '고', '고등학교') + '</div></div>' +
      '<div class="picker-row"><span>전공</span><div class="chips">' + chip('major', 'all', '전체') +
      majorsFor(profile.level).map(function (m) { return chip('major', m.k, m.k); }).join('') + '</div></div>' +
      '</section>' +

      '<section class="stats">' +
      '<div class="stat"><b>' + history.length + '<span style="font-size:14px;font-weight:500"> 회</span></b><span>완료한 상담 훈련</span></div>' +
      '<div class="stat"><b>' + (avg == null ? '–' : avg) + '<span style="font-size:14px;font-weight:500"> 점</span></b><span>평균 점수</span></div>' +
      '<div class="stat"><b class="text">' + (tm ? esc(tagLabel(tm)) : '아직 기록 없음') + '</b><span>내가 가장 자주 한 말실수</span></div>' +
      '</section>' +

      '<section style="display:grid;gap:14px">' +
      '<div class="sec-head"><h2>상담 시나리오 ' + list.length + '개</h2>' +
      '<span class="muted small">법령·지침 ' + counts.law + '건 · 판례 ' + counts.cas + '건 · 사건 ' + counts.news + '건 반영</span></div>' +
      (list.length ? '<div class="grid">' + list.map(scCard).join('') + '</div>'
        : '<div class="empty">이 조건에 맞는 시나리오가 없습니다. 조건을 하나 풀어 보세요.</div>') +
      '</section>' +
      '<p class="notice">이 프로그램은 교육·훈련용이며 법률 자문이 아닙니다. 법령과 판례는 ' + esc(META.asOf || '') + ' 기준으로 정리했고 이후 개정될 수 있습니다. 실제 사안은 학교 관리자, 교육청 교육활동보호센터(1395), 변호사와 상의하세요. 등장하는 인물과 대화는 실제 사례 유형을 바탕으로 만든 가상입니다.</p>';
  }

  /* ---------- 음성: 상대 말 읽어 주기와 내 말 받아쓰기 ----------
     게시된 링크에서는 Claude가 제공하는 tts·dictation 기능을, 단독 실행 파일에서는 브라우저의 Web Speech API를 쓴다.
     어느 쪽이든 쓸 수 없으면 null로 두고 글자로만 진행한다. */
  var voice = { tts: null, stt: null, muted: false, speaking: false, last: Promise.resolve(), lastText: '', mic: 'idle', base: '', fin: '', part: '' };
  function noop() { /* 일부러 비움 */ }
  /* 괄호 속 지문은 읽지 않는다: “(가방을 두고 일어서며) 그냥 두고 갈게요” → “그냥 두고 갈게요” */
  function spoken(text) { return String(text || '').replace(/\([^)]*\)/g, ' ').replace(/…+/g, ' ').replace(/\s+/g, ' ').trim(); }
  function voiceWhy() {
    return STANDALONE ? '이 브라우저는 음성 기능을 지원하지 않습니다. Chrome이나 Edge에서 열어 주세요.'
      : '이 화면에서는 음성을 쓸 수 없습니다. Chrome·Edge의 claude.ai 또는 Claude 데스크톱 앱 본창에서 열어 주세요.';
  }
  /* 저장된 설정을 지금 쓸 수 있는 범위로 낮춰서 읽는다(저장값 자체는 바꾸지 않는다) */
  function effVoice() {
    var v = settings.voice || 'off';
    if (v === 'talk' && (!voice.stt || settings.mode === 'choice')) { v = 'listen'; }
    if (v === 'listen' && !voice.tts) { v = 'off'; }
    return v;
  }
  function voiceOn() { return !!(sim && sim.voice && sim.voice !== 'off' && voice.tts && !voice.muted && current() === 'sim'); }
  function setSpeaking(on) { voice.speaking = !!on; refreshVoiceUi(); }
  function refreshVoiceUi() {
    var b = $('#voiceBtn');
    if (b) {
      b.hidden = !voice.tts;
      b.textContent = voice.muted ? '소리 켜기' : '소리 끄기';
      b.setAttribute('aria-pressed', String(!voice.muted));
    }
    var av = $('.phone-head .avatar'); if (av) { av.classList.toggle('speaking', !!voice.speaking); }
    var m = $('#micBtn');
    if (m) {
      m.hidden = !voice.stt;
      m.classList.toggle('live', voice.mic === 'listening');
      m.textContent = voice.mic === 'listening' ? '듣는 중 · 눌러서 멈춤' : voice.mic === 'starting' ? '마이크 준비 중…' : voice.mic === 'finishing' ? '마무리 중…' : '말하기';
      m.setAttribute('aria-pressed', String(voice.mic === 'listening'));

  /* 읽어 주기 제공자 */
  function capTts(t) {
    try {
      t.onState(function (e) {
        setSpeaking(e.state === 'starting' || e.state === 'speaking');
        if (e.state === 'idle' && e.reason) { sayFailed({ code: 'stopped', reason: e.reason }); }
      });
    } catch (e) { /* 상태 알림 없이도 동작 */ }
    return {
      say: function (text, who) { return t.add(text, { voice: who === 'student' ? 'airy' : 'rounded', language: 'ko' }); },
      stop: function () { try { return Promise.resolve(t.stop()).catch(noop); } catch (e) { return Promise.resolve(); } }
    };
  }
  function webTts() {
    var synth = window.speechSynthesis;
    if (!synth || typeof window.SpeechSynthesisUtterance !== 'function') { return null; }
    function ko() {
      var vs = [];
      try { vs = synth.getVoices() || []; } catch (e) { /* 무시 */ }
      for (var i = 0; i < vs.length; i++) { if (/^ko/i.test(vs[i].lang)) { return vs[i]; } }
      return null;
    }
    ko();                                               // 목소리 목록을 미리 불러 둔다
    return {
      say: function (text, who) {
        return new Promise(function (res, rej) {
          var u = new window.SpeechSynthesisUtterance(text);
          u.lang = 'ko-KR'; var v = ko(); if (v) { u.voice = v; }
          u.rate = 1.05; u.pitch = who === 'student' ? 1.2 : 0.9;
          var begun = false, done = false;
          u.onstart = function () { begun = true; setSpeaking(true); };
          u.onend = function () { done = true; setSpeaking(!!synth.pending); res(); };
          u.onerror = function (e) {

            var err = e && e.error;

          // 소리가 3초 안에 시작되지 않으면(목소리 없음 등) 기다리지 않고 글자로 넘어간다

    };
  }
  function sayFailed(e) {
    var code = e && e.code, reason = e && e.reason;

      if (voice.tts) { voice.tts = null; toast('이 화면에서는 읽어 주기를 쓸 수 없어 글자로만 진행합니다'); }
    } else if (code === 'no_start') {
      if (voice.tts) { voice.tts = null; toast('이 브라우저에서 소리를 재생하지 못해 글자로 이어 갑니다'); }
    } else if (code === 'no_gesture' || code === 'rate_limited' || reason === 'viewer_stopped' || reason === 'rate_limited') {
      if (!voice.muted) {
        voice.muted = true;
        toast(code === 'rate_limited' || reason === 'rate_limited' ? '읽어 주기가 잠시 제한되어 글자로 이어 갑니다' : '읽어 주기를 멈췄습니다. 다시 들으려면 소리 켜기를 누르세요');

  function say(text) {
    var s = spoken(text);
    if (!voiceOn() || !s || voice.mic !== 'idle') { return Promise.resolve(); }
    voice.lastText = s;
    var p;
    try { p = voice.tts.say(s.slice(0, 1900), sim.sc.who); } catch (e) { p = Promise.reject({ code: 'upstream_error' }); }
    voice.last = Promise.resolve(p).then(noop, sayFailed);
    return voice.last;
  }
  /* 다 읽을 때까지 기다리되, 소리가 막혀도 흐름이 멈추지 않게 글자 수에 비례한 한도를 둔다 */

  function voiceStop() {

  }
  function toggleVoice() {
    if (!sim || !voice.tts) { return; }

    } else {
      voice.muted = true; voice.tts.stop();
    }

  }

  /* 받아쓰기 제공자 */

      start: function () {
        var p = lang ? d.start({ language: lang }) : d.start();

    };

  function webStt() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

      start: function () {
        return new Promise(function (res, rej) {

    else if (code === 'unavailable') { voice.stt = null; toast('이 화면에서는 받아쓰기를 쓸 수 없습니다. 글자로 입력해 주세요'); }

    else if (code === 'rate_limited') { toast('받아쓰기가 잠시 제한되었습니다. 조금 뒤에 다시 눌러 주세요'); }
    else if (code !== 'dismissed' && code !== 'stopped' && code !== 'no_speech') { toast('받아쓰기를 시작하지 못했습니다. 다시 누르거나 글자로 입력해 주세요'); }

  }
  function toggleMic() {

  /* ---------- 상담 진행 ---------- */

  }

      '<div class="gauge risk"><div class="row"><span>법적 리스크</span><b>' + Math.round(sim.risk) + '</b></div><div class="gauge-bar"><i style="width:' + sim.risk + '%"></i></div></div>' +
      '<div class="gauge"><div class="row"><span>상대의 신뢰</span><b>' + Math.round(sim.trust) + '</b></div><div class="gauge-bar"><i style="width:' + sim.trust + '%"></i></div></div>' +
      (sim.fb === 'after' ? '<p class="hint">첨삭은 상담이 끝난 뒤 리포트에서 보여 드립니다.</p>' : '');

  function setReply(state) {
    var box = $('#reply'); if (!box) { return; }

    }

      box.innerHTML = '<div class="row" style="justify-content:space-between"><span class="hint">상담이 끝났습니다. 내 답이 어땠는지 확인해 보세요.</span>' +
        '<button class="btn" data-go="report">결과 리포트 보기</button></div>'; return;

  /* 타이머 */
  function timeLimit() {

  }
  function startTimer() {
    stopTimer();

  function bestOpt(t) { return t.opts.filter(function (o) { return o.g === 'safe'; })[0] || t.opts[0]; }
  function curTurn() { return sim.sc.turns[Math.min(sim.turn, sim.sc.turns.length - 1)]; }

  function norm(s) { return String(s || '').replace(/[\s.,!?…“”"'~()·\-]/g, ''); }
  /* 직전 반응(prev)이 다음 메시지(m)와 8자 이상 겹치면 같은 말로 본다(최장 공통 부분 문자열) */
  function covered(prev, m) {
    var a = norm(prev), b = norm(m); if (!a || b.length < 4) { return false; }
    var need = Math.min(8, b.length), best = 0, row = [];
    for (var j = 0; j <= b.length; j++) { row.push(0); }
    for (var i = 1; i <= a.length; i++) {
      var cur = [0];
      for (var k = 1; k <= b.length; k++) { cur[k] = a.charAt(i - 1) === b.charAt(k - 1) ? row[k - 1] + 1 : 0; if (cur[k] > best) { best = cur[k]; } }
      row = cur;
    }
    return best >= need;
  }
  function runTurn(prev) {
    var tk = sim.token = ++flowSeq; var t = curTurn();

    var p = Promise.resolve();
    t.msg.filter(function (m) { return !covered(prev, m); }).forEach(function (m) {
      p = p.then(function () { if (stale(tk)) { return; } return typing(m).then(function () { return themSay(m, tk); }); });
    });
    p.then(function () {
      if (stale(tk)) { return; }

    });
  }

  function applyGauges(e, opt) {
    var dr = e.g === 'safe' ? -6 : e.g === 'warn' ? 10 : 24;
    var dt = e.g === 'safe' ? 10 : e.g === 'warn' ? -3 : -12;
    if (opt && typeof opt.tr === 'number') { dt = opt.tr; }
    sim.risk = clamp(sim.risk + dr, 0, 100); sim.trust = clamp(sim.trust + dt, 0, 100);
  }
  function elapsed() { return Math.round((Date.now() - (sim.tStart || Date.now())) / 100) / 10; }

  function commit(entry, reaction, opt) {

    updateSide(); setReply('wait');
    var tk = sim.token = ++flowSeq;
    var p = reaction ? typing(reaction).then(function () { return themSay(reaction, tk); }) : Promise.resolve();

      sim.turn++;

  }

  function choose(i) {

  }

  function onTimeout() {

  /* ---------- 직접 입력: 키워드 보조 분석 ---------- */
  var NEG = /(수\s*(는|가)?\s*없|어렵|어려워|못\s*(해|합|하)|않(아|습|을|겠)|안\s*(돼|됩|되)|힘들|곤란|불가|드릴\s*수\s*없|말아)/;

    { tag: 'threat', re: /((생기부|생활기록부|세특|태도\s*점수)[^.?!\n]{0,14}(적어\s*버|적을\s*거|깎|다시\s*봐야|불이익))|(계속\s*(이러|그러)(시면|면)[^.?!\n]{0,18}(처리|징계|각오|맡기\s*어렵))|급식\s*못\s*먹/ },
    { tag: 'side', re: /(그럴\s*(애|아이|학생)(는|가)?\s*아니(라고|에요|죠|야)|저도\s*그렇게\s*생각)/ },

    { tag: 'admit', re: /((전부|모두|다)\s*(제|저의|학교)\s*(잘못|책임|과실)|제가\s*(다|전부)\s*책임|치료비[^.?!\n]{0,10}(제가|학교가)\s*(다|전부))/ },
    { tag: 'lead', re: /((아빠|엄마|그\s*(애|형|친구|선생님))가?[^.?!\n]{0,10}(때렸지|만졌지|그랬지|한\s*거\s*맞지))|증거\s*있(어|니|나요)/ },
    { tag: 'evidence', re: /((사진|영상|캡처)[^.?!\n]{0,12}(선생님한테|나한테|저한테|제게)\s*(보내|전송))|녹음\s*(하지\s*마|끄세요|지우)/ },
    { tag: 'politics', re: /(대통령|정당|여당|야당|보수|진보|좌파|우파)[^.?!\n]{0,16}(이\s*(맞|옳)|지지|뽑아|잘못됐)/ }
  ];
  var GOOD = [
    { label: '공감·경청', re: /(속상|놀라셨|놀랐|걱정|힘들었|힘드셨|마음이|말해\s*줘서|말씀해\s*주셔서|용기|이해(해|합니다|가\s*됩)|당황|불안)/ },
    { label: '사실 확인', re: /(확인(해|하고|한\s*뒤|이\s*필요)|살펴|파악|알아보|양쪽|사실\s*관계|들어\s*보)/ },
    { label: '절차 안내', re: /(절차|규정|지침|법령|학칙|기준|전담|위원회|심의|민원\s*대응|교감|교장|관리자|담당\s*(부서|선생님)|상담\s*(예약|일정)|공제회|이의\s*신청)/ },
    { label: '보고·신고 고지', re: /(보고|기록|신고|알려야|알릴\s*수밖에|도와줄\s*수\s*있는\s*(어른|분)|전문\s*기관|상담\s*선생님|위\s*클래스|Wee)/i },
    { label: '시한 약속', re: /(오늘\s*(중|안)|내일\s*(까지|오전|오후)|\d+\s*시(까지)?|다시\s*(연락|전화)|회신)/ },
    { label: '한계 고지', re: /(수(는|가)?\s*없(습니다|어요|어|다)|드리기\s*어렵|약속(할|드릴)\s*수(는)?\s*없|단정(하기|할\s*수)|제\s*권한|말씀드리기\s*어렵|알려\s*드릴\s*수\s*없|결정할\s*수\s*없|비밀로\s*할\s*수(는)?\s*없)/ }
  ];
  function analyze(text) {
    var tags = [], pos = [];
    RULES.forEach(function (r) {
      var m = r.re.exec(text); if (!m) { return; }
      var tail = text.slice(m.index + m[0].length, m.index + m[0].length + 14);
      if (NEG.test(m[0].slice(-6) + tail)) { return; }           // “약속할 수는 없어”처럼 부정·한계 고지는 제외
      if (tags.indexOf(r.tag) < 0) { tags.push(r.tag); }
    });
    GOOD.forEach(function (g) { if (g.re.test(text)) { pos.push(g.label); } });
    var sev = 'safe';
    tags.forEach(function (t) { var s = (TAGS[t] && TAGS[t].sev) || 'risk'; if (s === 'risk') { sev = 'risk'; } else if (sev !== 'risk') { sev = 'warn'; } });
    var fb, laws = [];

      fb = tags.map(function (t) { return TAGS[t] ? TAGS[t].why : ''; }).filter(Boolean).join(' ');

    } else if (text.replace(/\s/g, '').length < 10) {

        sum += (e.g !== 'safe' && hit) ? ptsOf(e) : 10;

  /* ---------- 말실수 퀴즈 ---------- */
  var QUIZ_SEC = 12;

  function renderQuiz() {
